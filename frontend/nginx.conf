server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Deja pasar archivos grandes (imágenes) hacia el backend
    client_max_body_size 10M;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Todo lo que el frontend pide a /api/ se reenvía al contenedor "backend".
    # Como esto ocurre DENTRO de la red de Docker (backend:80), el navegador
    # nunca necesita saber la IP real del backend: siempre pide a la misma
    # IP/host desde la que cargó la página, en el mismo puerto 80.
    location /api/ {
        proxy_pass http://backend:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

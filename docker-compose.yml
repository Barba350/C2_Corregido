services:

  db:
    # MariaDB es compatible con el driver mysqli del backend y con la sintaxis
    # SQL de init.sql. La imagen alpine pesa ~120MB frente a ~1GB de mysql:8.4.
    image: mariadb:11-alpine
    container_name: barba_db
    environment:
      MARIADB_ROOT_PASSWORD: root123
      MARIADB_DATABASE: barba_db
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - barba_net
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh --connect --innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    build: ./backend
    container_name: barba_backend
    environment:
      DB_HOST: db
      DB_NAME: barba_db
      DB_USER: root
      DB_PASS: root123
      AWS_REGION: ${AWS_REGION}
      AWS_BUCKET_NAME: ${AWS_BUCKET_NAME}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
    expose:
      - "80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - barba_net

  frontend:
    build: ./frontend
    container_name: barba_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - barba_net

volumes:
  db_data:

networks:
  barba_net:
